name: CI Pipeline

on:
  push:
    branches: ["main", "pre-prod"]
  pull_request:
    branches: ["main", "pre-prod"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip # cache pip packages between workflow runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run API and UI tests
      run: |
        pytest -q

    - name: Build Docker image
      run: |
        docker build -t video-downloader .

  selenium:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Set up Chrome browser for Selenium
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Selenium UI tests
      run: |
        pytest -q tests/test_selenium.py

